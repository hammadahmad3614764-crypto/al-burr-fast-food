<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Burr Fast Food</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <img src="logo.png" alt="Al Burr Logo" class="pop-logo" onerror="this.src='https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500'">
            <h1>Al Burr Fast Food</h1>
            <p>خوش آمدید! بہترین ذائقہ، آپ کے دروازے پر</p>
        </div>
    </div>

    <!-- Customer Details Screen -->
    <div id="customer-screen" class="screen hidden">
        <div class="container">
            <img src="logo.png" alt="Logo" class="form-logo" onerror="this.src='https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500'">
            <h2>Al Burr Fast Food</h2>
            <p class="tagline">آرڈر کرنے کے لیے اپنی تفصیلات درج کریں</p>
            
            <form id="customer-form">
                <div class="input-group">
                    <label><i class="fa fa-user"></i> کسٹمر کا نام</label>
                    <input type="text" id="cust-name" required placeholder="अपना نام لکھیں">
                </div>
                <div class="input-group">
                    <label><i class="fa fa-phone"></i> فون نمبر</label>
                    <input type="tel" id="cust-phone" required placeholder="03XXXXXXXXX">
                </div>
                <div class="input-group">
                    <label><i class="fa fa-map-marker-alt"></i> مکمل ایڈریس</label>
                    <textarea id="cust-address" required placeholder="گھر کا پتہ / علاقہ"></textarea>
                </div>
                <button type="submit" class="btn-primary">مینو کی طرف جائیں <i class="fa fa-arrow-left"></i></button>
            </form>
        </div>
    </div>

    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen hidden">
        <header>
            <div class="header-left">
                <img src="logo.png" alt="Logo" class="header-logo" onerror="this.src='https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500'">
                <span>Al Burr Fast Food</span>
            </div>
            <button id="cart-btn" class="cart-icon-btn">
                <i class="fa fa-shopping-cart"></i> کارٹ 
                <span id="cart-count">0</span>
            </button>
        </header>

        <!-- Top Category Filter Buttons -->
        <div class="categories-bar">
            <button class="cat-btn active" onclick="filterCategory('all', this)"><i class="fa fa-utensils"></i> سب</button>
            <button class="cat-btn" onclick="filterCategory('burger', this)"><i class="fa fa-hamburger"></i> برگر</button>
            <button class="cat-btn" onclick="filterCategory('pizza', this)"><i class="fa fa-pizza-slice"></i> پیزا</button>
            <button class="cat-btn" onclick="filterCategory('rolls', this)"><i class="fa fa-hotdog"></i> رولز</button>
            <button class="cat-btn" onclick="filterCategory('shawarma', this)"><i class="fa fa-bread-slice"></i> شاورما</button>
            <button class="cat-btn" onclick="filterCategory('pasta', this)"><i class="fa fa-bowl-food"></i> پاستا</button>
            <button class="cat-btn" onclick="filterCategory('fries', this)"><i class="fa fa-french-fries"></i> فرائز & ونگز</button>
        </div>

        <!-- Menu Grid Container -->
        <div class="menu-container" id="menu-grid">
            <!-- Items loaded dynamically -->
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="close-cart">&times;</span>
            <h2><i class="fa fa-shopping-cart"></i> آپ کی کارٹ</h2>
            <div id="cart-items-container">
                <!-- Cart items -->
            </div>
            <div class="cart-summary">
                <h3>کل رقم: <span id="cart-total-price">Rs. 0</span></h3>
                <button id="whatsapp-checkout-btn" class="btn-whatsapp">
                    <i class="fab fa-whatsapp"></i> واٹس ایپ پر آرڈر بھیجیں
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
